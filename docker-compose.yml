services:
  db:
    image: postgres:16-alpine
    container_name: truckscope-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: truckscope
      POSTGRES_USER: truckscope
      POSTGRES_PASSWORD: truckscope_password
    ports:
      - "5432:5432"
    volumes:
      - truckscope_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truckscope -d truckscope"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: truckscope-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://truckscope:truckscope_dev@db:5432/truckscope
      DB_PATH: /app/data/leads.db
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  truckscope_data:
